name: Deploy NCF site + repository to FTP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the package without uploading'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to FTP Server
    runs-on: ubuntu-latest
    
    steps:
    - name: 📂 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, zip

    - name: 🟢 Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build the landing page
      run: npm run generate
      env:
        NUXT_PUBLIC_REPOSITORY_BASE: /repository
        NUXT_PUBLIC_REGISTRATION_ENDPOINT: ${{ secrets.NUXT_PUBLIC_REGISTRATION_ENDPOINT }}

    # scripts/package.mjs assembles, writes config.local.php and validates, so
    # CI and a local `npm run package` produce byte-identical output.
    - name: 🧩 Assemble and validate the package
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        LANDING_PAGE_URL: ${{ vars.LANDING_PAGE_URL }}
      run: node scripts/package.mjs

    - name: ✅ Lint the packaged PHP
      run: |
        set -e
        find deploy/repository -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
        echo "All PHP files parse."
        echo "Package contains $(find deploy -type f | wc -l) files."

    - name: 🧪 Dry run summary
      if: inputs.dry_run
      run: |
        echo "Dry run — nothing uploaded."
        find deploy -maxdepth 2 -type d | sort

    - name: 🌐 Deploy via FTP
      if: ${{ !inputs.dry_run }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
        port: ${{ secrets.FTP_PORT || 21 }}
        local-dir: ./deploy/
        server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
        log-level: standard
        dry-run: false
        # Delegate uploads live only on the server — never sync or delete them.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          repository/uploads/**
          **/*.log
          .DS_Store
          Thumbs.db

    # Confirms the live site actually responds, rather than trusting the upload.
    - name: 🏥 Health Check
      if: ${{ !inputs.dry_run && vars.SITE_URL != '' }}
      run: |
        set -e
        base="${{ vars.SITE_URL }}"
        base="${base%/}"

        check() {
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "$1")
          printf '  %-62s %s\n' "$1" "$code"
          case "$code" in
            "$2") return 0 ;;
            *) echo "::error::Expected $2 from $1 but got $code"; return 1 ;;
          esac
        }

        echo "Checking $base"
        check "$base/" 200
        check "$base/repository/client/?category=event_resources" 200
        check "$base/repository/client/?category=reports" 200
        check "$base/repository/client/?category=commodity_profiles" 200
        check "$base/repository/admin/" 200

        # config.local.php must never be fetchable as text.
        leak=$(curl -sS --max-time 30 "$base/repository/includes/config.local.php" || true)
        if printf '%s' "$leak" | grep -q 'db_pass'; then
          echo "::error::config.local.php is being served as plain text."
          exit 1
        fi
        echo "Credentials are not exposed."

    - name: 🔍 Post-Deployment Notes
      run: |
        echo "🎉 Deployment completed."
        echo "   Landing page:  /"
        echo "   Repositories:  /repository/client/?category=event_resources"
        echo "   Admin portal:  /repository/admin/"
        echo "   Commit:        ${{ github.sha }}"
        echo ""
        echo "If the schema changed, open /repository/migrate.php once, then delete it."
